<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sparkle Spell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Sparkle Spell">
<meta name="theme-color" content="#ff5fa2">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Sparkle Spell Party: a kindergarten spelling game with coins, collectible cards and an avatar closet.">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Sparkle Spell Party ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff5fa2;--purple:#9b5de5;--blue:#00bbf9;--teal:#00d4b4;--yellow:#fee440;--orange:#ff9f1c;--green:#06d6a0;--ink:#2d1b4e;
  --font:'Fredoka','Baloo 2','Arial Rounded MT Bold','Chalkboard SE','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;
  background:linear-gradient(135deg,#ffd6f0 0%,#e3d6ff 35%,#d6ecff 65%,#d6fff1 100%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.5;
  background-image:radial-gradient(#fff 2px,transparent 2.5px),radial-gradient(#fff 1.5px,transparent 2px);background-size:60px 60px,90px 90px;background-position:0 0,30px 45px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
.btn{min-height:64px;min-width:64px;border-radius:24px;font-size:26px;font-weight:700;padding:8px 18px;background:#fff;
  box-shadow:0 6px 0 rgba(45,27,78,.22),0 8px 18px rgba(45,27,78,.12);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(45,27,78,.22)}
.hidden{display:none!important}
/* header */
#hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));
  background:rgba(255,255,255,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 3px 12px rgba(45,27,78,.12)}
#hdr .hb{min-width:64px;min-height:64px;padding:0;font-size:32px;border-radius:20px}
#hdrAvatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#ffe3f3,#e0f4ff);border:4px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15);overflow:hidden;flex:none}
#hdrAvatar svg{width:100%;height:100%}
.brand{font-size:clamp(20px,3.2vw,32px);font-weight:700;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#ff5fa2,#9b5de5,#00bbf9);-webkit-background-clip:text;background-clip:text;color:transparent}
#coinPill{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#fff7b3,#ffd23f);border:4px solid #fff;border-radius:40px;padding:6px 16px;
  font-size:30px;font-weight:700;box-shadow:0 4px 0 #e0a800;min-height:60px}
#coinPill.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.25) rotate(-4deg)}60%{transform:scale(.95)}}
.coin{display:inline-block;animation:spinCoin 3s infinite}
@keyframes spinCoin{0%,80%{transform:rotateY(0)}90%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
main{max-width:1200px;margin:0 auto;padding:14px 14px 40px}
.screen{display:none;animation:screenIn .35s ease}
.screen.active{display:block}
@keyframes screenIn{from{opacity:0;transform:translateY(16px) scale(.98)}}
h1,h2,h3{margin:.2em 0}
/* home */
.home-wrap{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:20px;align-items:start}
@media (max-width:820px){.home-wrap{grid-template-columns:1fr}}
.panel{background:rgba(255,255,255,.8);border-radius:32px;padding:16px;box-shadow:0 8px 24px rgba(45,27,78,.12);border:4px solid #fff}
.hello{font-size:30px;font-weight:700;text-align:center}
.home-avatar{width:100%;max-width:300px;margin:0 auto;aspect-ratio:244/272;background:radial-gradient(circle at 50% 40%,#fff 0,#ffe7f5 55%,#e8dcff 100%);border-radius:28px;cursor:pointer}
.home-avatar svg{width:100%;height:100%}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.nav{flex-direction:column;min-height:96px;font-size:40px;color:#fff;background:var(--bg);text-shadow:0 2px 0 rgba(0,0,0,.2);position:relative}
.nav span{font-size:20px}
.pip{position:absolute;top:-8px;right:-8px;background:#ff3b3b;color:#fff;border:3px solid #fff;border-radius:20px;font-size:18px;min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0 6px;animation:bob 1.2s infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
/* ---- grade level picker ---- */
.lv-title{text-align:center;font-size:clamp(24px,4vw,32px);font-weight:700;margin:0 0 10px}
.lv-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 18px}
.lvbtn{position:relative;flex-direction:column;gap:2px;min-height:150px;padding:18px 8px 12px;border-radius:30px;color:var(--ink);
  background:linear-gradient(170deg,#fff 0%,var(--l1) 55%,var(--l2) 160%);border:5px solid #fff;box-shadow:0 7px 0 rgba(45,27,78,.18);opacity:.82;transition:transform .15s,opacity .15s}
.lvbtn .lv-ic{font-size:clamp(46px,7vw,64px);line-height:1}
.lvbtn .lv-nm{font-size:clamp(20px,2.8vw,28px);font-weight:700;line-height:1.1}
.lvbtn .lv-sub{font-size:clamp(14px,1.8vw,17px);font-weight:600;opacity:.75;line-height:1.15}
.lvbtn.on{opacity:1;transform:scale(1.04);border-color:var(--l2);box-shadow:0 0 0 5px #fff,0 9px 0 rgba(45,27,78,.22)}
.lvbtn.on .lv-ic{animation:bob 1.6s infinite}
.lv-check{position:absolute;left:10px;top:8px;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.xbadge{position:absolute;top:-14px;right:-6px;transform:rotate(8deg);background:linear-gradient(180deg,#fff27a,#ffb703);color:#7a3b00;font-weight:700;font-size:clamp(15px,2vw,19px);
  padding:5px 11px;border-radius:16px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap;animation:wob 2.4s infinite}
@keyframes wob{0%,100%{transform:rotate(8deg) scale(1)}50%{transform:rotate(3deg) scale(1.08)}}
.xbadge.xb-end{position:static;display:inline-block;transform:none;font-size:clamp(18px,4.5vw,24px);margin-top:10px;animation:none;white-space:normal;max-width:100%}
.lv-pick.compact{margin:8px 0}
.lv-pick.compact .lvbtn{min-height:110px;padding-top:16px}
.lv-pick.compact .lv-nm{font-size:clamp(16px,2.4vw,22px)}
@media (max-width:560px){
  .lv-pick{grid-template-columns:1fr;gap:16px}
  .lvbtn{flex-direction:row;justify-content:flex-start;min-height:84px;padding:10px 10px 10px 48px;gap:8px;text-align:left}
  .lvbtn .lv-ic{font-size:42px}
  .lvbtn .lv-nm{font-size:clamp(20px,6vw,25px)}
  .lvbtn .lv-sub{display:none}
  .lvbtn .lv-check{left:10px;top:50%;margin-top:-17px}
  .lvbtn.on{transform:scale(1.02)}
  .lvbtn .xbadge{position:static;order:5;margin-left:auto;transform:rotate(4deg);animation:none;font-size:14px;padding:3px 7px;flex-shrink:0}
  .lvbtn .lv-nm{white-space:nowrap}
  .lv-pick.compact .lvbtn{min-height:70px}
}
@media (max-width:360px){.lvbtn .lv-ic{font-size:30px}.lvbtn .lv-nm{font-size:19px}.lvbtn{padding-left:44px;gap:6px}}
.lvchip{display:inline-flex;align-items:center;gap:4px;font-size:.6em;vertical-align:middle;padding:4px 12px;border-radius:16px;background:linear-gradient(170deg,var(--l1),var(--l2));color:#2d1b4e;border:3px solid #fff;white-space:nowrap}
.luck{display:inline-block;margin:6px auto 0;font-size:20px;font-weight:700;background:#e3ffd9;color:#16794a;border:3px solid #fff;border-radius:18px;padding:6px 14px}
/* ---- long words at higher grades ---- */
.slots.long{gap:6px;flex-wrap:nowrap}
.slots.long .slot{width:calc((100% - (var(--n) - 1) * 6px) / var(--n));max-width:78px;height:auto;aspect-ratio:4/5;font-size:clamp(26px,6vw,54px);border-radius:14px;border-width:3px}
.tiles.many{gap:10px}
.tiles.many .tile{width:clamp(62px,10vw,92px);height:clamp(62px,10vw,92px);font-size:clamp(38px,6vw,56px);border-radius:20px}
.mword.long{gap:4px}
.mword.long span{min-width:0;flex:0 1 auto;font-size:clamp(34px,8vw,80px);padding:0 3px}
.mword .blank.multi{min-width:clamp(80px,16vw,140px)}
.choice.multi{font-size:clamp(40px,8vw,58px);min-width:clamp(110px,22vw,150px)}
.mc-front.word.l5,.mc-front.word.l6{font-size:clamp(22px,3.8vw,40px)}
.mc-front.word.l7,.mc-front.word.l8{font-size:clamp(17px,3vw,32px)}
.mc-front.word{padding:4px;line-height:1.05;word-break:break-word;text-align:center}
.mgrid.n16{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (min-width:900px){.mgrid.n16{grid-template-columns:repeat(8,minmax(0,1fr));max-width:1100px}}
.mgrid.n16 .mcard{min-height:80px}
.squish .lbl.w.xl{font-size:clamp(24px,3.4vw,34px)}
.level-toggle{display:flex;gap:10px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.level-toggle .btn{font-size:24px;background:#fff;opacity:.7}
.level-toggle .btn.on{background:var(--yellow);opacity:1;outline:4px solid #fff}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.gbtn{flex-direction:column;min-height:170px;border-radius:32px;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2));font-size:26px;text-shadow:0 2px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.gbtn .gi{font-size:76px;line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));animation:bob 2s infinite}
.gbtn:nth-child(2) .gi{animation-delay:.3s}.gbtn:nth-child(3) .gi{animation-delay:.6s}.gbtn:nth-child(4) .gi{animation-delay:.9s}.gbtn:nth-child(5) .gi{animation-delay:1.2s}
.gbtn::after{content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;background:rgba(255,255,255,.25);transform:rotate(25deg);animation:shine 4s infinite}
@keyframes shine{0%,70%{left:-60%}100%{left:130%}}
.parent-btn{display:block;margin:28px auto 0;position:relative;overflow:hidden;font-size:18px;min-height:60px;padding:0 22px;border-radius:30px;background:rgba(255,255,255,.6);color:#6b5a86}
.parent-btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:#c9f2e4;z-index:-1;transition:width .2s}
.parent-btn.holding::before{width:100%;transition:width 3s linear}
.parent-btn{z-index:0;touch-action:none;-webkit-user-select:none;-webkit-touch-callout:none}
/* game */
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
#gTitle{font-size:32px;font-weight:700}
#gDots{display:flex;gap:6px;font-size:28px}
#gDots .dot{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#ccc;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
#gDots .dot.on{background:#fff4b8;animation:bump .5s}
#gArea{background:rgba(255,255,255,.82);border-radius:36px;padding:18px;min-height:520px;border:4px solid #fff;box-shadow:0 8px 24px rgba(45,27,78,.12);position:relative;overflow:hidden;text-align:center}
.q-row{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.q-pic{font-size:clamp(90px,16vw,150px);line-height:1.1;cursor:pointer;animation:picIn .5s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 6px 0 rgba(0,0,0,.1))}
.q-pic.sm{font-size:80px}
@keyframes picIn{from{transform:scale(0) rotate(-20deg)}}
.speak{font-size:40px;min-width:84px;min-height:84px;border-radius:50%;background:var(--blue);color:#fff}
.speak.talk{animation:bump .6s}
.slots{display:flex;gap:10px;justify-content:center;margin:16px 0;flex-wrap:wrap}
.slot{width:clamp(64px,11vw,92px);height:clamp(76px,13vw,104px);border-radius:20px;background:#f3ecff;border:4px dashed #b9a3e8;font-size:clamp(46px,8vw,68px);font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--purple)}
.slot.filled{border-style:solid;border-color:var(--green);background:#dcfff3;color:#0a8f6a;animation:bump .4s}
.slot.next{border-color:var(--pink);background:#fff0f7}
.tiles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tile{width:clamp(76px,12vw,104px);height:clamp(76px,12vw,104px);font-size:clamp(46px,7vw,64px);border-radius:24px;background:linear-gradient(180deg,#fff,#ffe9f6);color:var(--ink)}
.tile:nth-child(4n+1){background:linear-gradient(180deg,#fff,#ffe1f0)}.tile:nth-child(4n+2){background:linear-gradient(180deg,#fff,#dff3ff)}.tile:nth-child(4n+3){background:linear-gradient(180deg,#fff,#fff6cc)}.tile:nth-child(4n){background:linear-gradient(180deg,#fff,#e2ffe9)}
.tile.used{visibility:hidden}
.hint{animation:glow 1s infinite!important;outline:5px solid var(--yellow)}
@keyframes glow{50%{transform:scale(1.12);box-shadow:0 0 30px 10px #fff38a}}
.wiggle{animation:wiggle .5s}
@keyframes wiggle{20%{transform:translateX(-10px) rotate(-6deg)}40%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hintbtn{position:absolute;right:14px;top:14px;font-size:34px;background:#fff8c4}
.mword{display:flex;justify-content:center;gap:8px;margin:14px 0}
.mword span{font-size:clamp(56px,10vw,88px);font-weight:700;min-width:clamp(64px,11vw,96px);padding:0 6px;border-bottom:6px solid #d9ccf5}
.mword .blank{color:var(--pink);background:#fff0f7;border-radius:18px 18px 0 0;border-bottom-color:var(--pink);animation:bob 1.2s infinite}
.mword .blank.filled{color:#0a8f6a;background:#dcfff3;border-bottom-color:var(--green);animation:bump .4s}
.choices{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.choice{min-width:120px;min-height:120px;font-size:66px;border-radius:30px;color:#fff;background:var(--cc)}
.choice.word{font-size:46px;min-width:170px}
.choice:disabled{opacity:.3;transform:scale(.9)}
/* balloons */
.bal-top{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.bal-top .slots{margin:6px 0}
.bal-top .slots.long{flex:1 1 100%}
.sky{position:relative;height:clamp(340px,52vh,520px);margin-top:8px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#bfe9ff,#e9f8ff 70%,#d7ffe0);touch-action:none}
.cloud{position:absolute;font-size:70px;opacity:.85;animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(1400px)}}
.balloon{position:absolute;bottom:0;width:96px;height:116px;margin-left:-48px;border-radius:50% 50% 47% 47%/55% 55% 45% 45%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,transparent 26%),var(--bc);display:flex;align-items:center;justify-content:center;
  font-size:54px;font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);cursor:pointer;will-change:transform;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.balloon::before{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom:12px solid var(--bc);transform:rotate(180deg);border-top:0}
.balloon::after{content:"";position:absolute;top:122px;left:50%;width:2px;height:70px;background:rgba(80,80,80,.45)}
.balloon.popped{animation:popB .3s forwards;pointer-events:none}
@keyframes popB{50%{transform:scale(1.4)}100%{transform:scale(0);opacity:0}}
.balloon.hint{outline:none;filter:drop-shadow(0 0 18px #fff200) drop-shadow(0 0 8px #fff200)}
.balloon.no{animation:wiggle .5s}
/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:760px;margin:10px auto}
.mgrid.n12{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (min-width:900px){.mgrid.n12{grid-template-columns:repeat(6,minmax(0,1fr));max-width:1000px}}
.mcard{aspect-ratio:3/4;perspective:800px;min-height:100px;min-width:0}
.mc-inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .mc-inner{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 rgba(45,27,78,.18)}
.mc-back{background:repeating-linear-gradient(45deg,#ff8cc6 0 14px,#ffa6d4 14px 28px);font-size:52px;border:5px solid #fff}
.mc-front{background:#fff;transform:rotateY(180deg);font-size:clamp(50px,8vw,80px);border:5px solid #ffd1ea}
.mc-front.word{font-size:clamp(34px,5vw,52px);font-weight:700;color:var(--purple)}
.mcard.matched .mc-front{border-color:var(--green);background:#e2fff4;animation:bump .5s}
/* squishy */
.squishes{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.squish{width:clamp(150px,22vw,200px);height:clamp(150px,22vw,190px);position:relative;border-radius:50% 50% 44% 44%/58% 58% 42% 42%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.8) 0 8%,transparent 25%),var(--sc);
  box-shadow:inset -10px -14px 0 rgba(0,0,0,.08),0 10px 0 rgba(45,27,78,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:jelly 2.4s infinite ease-in-out;transform-origin:50% 100%}
.squish:nth-child(2){animation-delay:.4s}.squish:nth-child(3){animation-delay:.8s}
@keyframes jelly{50%{transform:scale(1.04,.96)}}
.squish.sq{animation:squeeze .5s}
@keyframes squeeze{30%{transform:scale(1.3,.65)}60%{transform:scale(.9,1.15)}}
.squish .face{font-size:30px;line-height:1;margin-bottom:4px;color:#2d1b4e;font-weight:700}
.squish .lbl{font-size:clamp(44px,6vw,62px);font-weight:700;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.squish .lbl.w{font-size:clamp(32px,4.5vw,44px)}
.squish .ears{position:absolute;top:-14px;font-size:34px}
/* round end */
.round-end{padding:20px}
.round-end .big{font-size:90px;animation:bob 1s infinite}
.round-end h2{font-size:52px;color:var(--pink)}
.earned{font-size:48px;font-weight:700;display:inline-block;background:#fff4b8;border-radius:30px;padding:8px 26px;margin:10px}
.freeball{font-size:34px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff5fa2,#9b5de5);border-radius:30px;padding:10px 20px;display:inline-block;margin:10px;animation:bump 1s infinite}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.row .btn{font-size:30px;min-height:80px;padding:0 26px}
.btn.go{background:var(--green);color:#fff}.btn.pk{background:var(--pink);color:#fff}.btn.pu{background:var(--purple);color:#fff}.btn.yl{background:var(--yellow)}.btn.bl{background:var(--blue);color:#fff}
/* toast & modal */
#toast{position:fixed;left:50%;top:110px;transform:translate(-50%,-30px) scale(.8);opacity:0;z-index:90;background:#fff;border-radius:30px;padding:14px 28px;font-size:34px;font-weight:700;box-shadow:0 10px 30px rgba(45,27,78,.25);border:5px solid var(--yellow);pointer-events:none;transition:all .3s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#toast{width:max-content;max-width:calc(100vw - 24px);white-space:normal;text-align:center}
@media (max-width:500px){#toast{font-size:26px;padding:12px 20px}}

.tab{flex:none;min-height:70px;min-width:70px;padding:0 18px;border-radius:24px;font-size:26px;font-weight:700;background:#fff;box-shadow:0 5px 0 rgba(45,27,78,.15)}

.sitem{position:relative;background:#fff;border-radius:28px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(45,27,78,.15);border:4px solid #fff;transition:transform .1s}

.sicon{width:120px;height:120px;border-radius:24px;display:flex;align-items:center;justify-content:center;background:var(--ib,#ffeaf5);overflow:hidden}

.iemo{font-size:72px;line-height:1}
.i67{font-size:56px;font-weight:700;color:#fff;background:linear-gradient(135deg,#9b5de5,#ff5fa2);border-radius:18px;padding:0 10px;text-shadow:0 3px 0 rgba(0,0,0,.2)}

.sname{font-size:20px;font-weight:700;line-height:1.1;min-height:44px;display:flex;align-items:center;text-align:center}

.sowned{font-size:22px;font-weight:700;color:#0a8f6a}
.badge{position:absolute;top:-10px;left:-8px;z-index:2;font-size:18px;font-weight:700;color:#fff;border-radius:14px;padding:4px 10px;border:3px solid #fff;transform:rotate(-10deg);animation:bob 1.4s infinite}

.pv{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}

/* closet */
.closet>*,.home-wrap>*{min-width:0}
.closet{display:grid;grid-template-columns:minmax(240px,380px) 1fr;gap:18px;align-items:start}

.ctabs .tab{min-width:72px;padding:0 12px;font-size:36px}
.none-tile .iemo{opacity:.6}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{position:relative;border-radius:22px;padding:8px;aspect-ratio:5/7;display:flex;flex-direction:column;align-items:center;background:#fff;border:6px solid var(--rc);box-shadow:0 6px 0 rgba(45,27,78,.18);overflow:hidden}
.card .art{flex:1;width:100%;border-radius:14px;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.card .ce{font-size:clamp(60px,9vw,84px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
.card .ca{position:absolute;right:6px;bottom:4px;font-size:34px}
.card .cn{font-size:17px;font-weight:700;margin-top:6px;line-height:1.1;text-align:center;min-height:38px;display:flex;align-items:center}
.card .cr{font-size:13px;font-weight:700;color:#fff;background:var(--rc);border-radius:10px;padding:2px 8px;margin-top:4px;white-space:nowrap}
.card .cnt{position:absolute;top:6px;right:6px;background:#2d1b4e;color:#fff;font-weight:700;border-radius:14px;padding:2px 10px;font-size:18px;z-index:3}
.card.locked .ce{filter:brightness(0);opacity:.18}
.card.locked .art{background:repeating-linear-gradient(45deg,#eee 0 12px,#f6f6f6 12px 24px)}
.card.locked .ca{display:none}
.card.locked .q{position:absolute;font-size:60px;color:#bbb;font-weight:700}
.r-C{--rc:#8fa3bf}.r-R{--rc:#2ec4b6}.r-E{--rc:#9b5de5}.r-U{--rc:#ff7b00}.r-L{--rc:#ff3d9a}
.card.r-L:not(.locked){border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff5f5f,#ffd23f,#5fdc7a,#4dabff,#b36bff,#ff5f5f) border-box;background-size:100% 100%,300% 100%;animation:holo 3s linear infinite}
@keyframes holo{to{background-position:0 0,300% 0}}

let AC=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(freq,dur,type='sine',vol=.18,when=0,slide){
  if(S.muted)return;const a=ac();if(!a)return;
  const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05);
}

const hasSpeech='speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined';
let VOICE=null;
function pickVoice(){if(!hasSpeech)return;const vs=speechSynthesis.getVoices()||[];
  VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Google US English|Aria|Jenny|Ava|Allison|Zira/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if(hasSpeech){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
/* iOS Safari: speech + Web Audio only work after a real user tap. Unlock both on the first touch/click. */
let SPEECH_UNLOCKED=false;
function unlockAudio(){
  try{ac();}catch(e){}
  if(SPEECH_UNLOCKED||!hasSpeech)return;
  SPEECH_UNLOCKED=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;u.rate=1;u.lang='en-US';speechSynthesis.speak(u);}catch(e){}
  if(!VOICE)pickVoice();
}
['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&hasSpeech){try{speechSynthesis.resume();}catch(e){}}});
function say(text,rate){
  if(!hasSpeech||!text)return;
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=rate||S.rate||.8;u.pitch=1.15;u.lang='en-US';if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(e){}
}

/* ================= FX ================= */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],fxOn=false;
function resizeFx(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}
resizeFx();addEventListener('resize',resizeFx);
function mkPart(x,y,vx,vy,g,life){return{x,y,vx,vy,g,s:7+Math.random()*9,c:pick(COLORS),r:Math.random()*6,vr:(Math.random()-.5)*.3,life,shape:rand(3)};}
function burst(x,y,n=40,power=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(3+Math.random()*9)*power;parts.push(mkPart(x,y,Math.cos(a)*v,Math.sin(a)*v-4,.3,70+Math.random()*40));}runFx();}
function confettiRain(n=140){for(let i=0;i<n;i++)parts.push(mkPart(Math.random()*innerWidth,-20-Math.random()*300,(Math.random()-.5)*3,2+Math.random()*3,.06,260));runFx();}
function runFx(){if(!fxOn){fxOn=true;requestAnimationFrame(fxLoop);}}
function star(ctx,r){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=i*Math.PI/5-Math.PI/2;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();}
function fxLoop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.life/30);cx.fillStyle=p.c;
    if(p.shape===0)cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else if(p.shape===1){cx.beginPath();cx.arc(0,0,p.s/2.5,0,7);cx.fill();}else star(cx,p.s/1.6);
    cx.restore();}
  if(parts.length)requestAnimationFrame(fxLoop);else{fxOn=false;cx.clearRect(0,0,innerWidth,innerHeight);}
}
function burstAt(el,n=40,p=1){if(!el)return;const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,n,p);}
let toastT=null;
function toast(msg,ms=1500){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}
function floaty(text,x,y){const f=document.createElement('div');f.className='floaty';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200);}

let G=null;
function pickWords(n,type){
  const lv=S.level;let pool=LV().words;
  if(type==='match'){ // memory cards need words you can picture, with different emojis
    const seen=new Set();pool=shuffle(pool.filter(w=>!w.s&&w.w.length<=7)).filter(w=>!seen.has(w.e)&&seen.add(w.e));
    return pool.slice(0,n);
  }
  if(lv==='k'){const sm=shuffle(pool.filter(w=>w.w.length<=3)),big=shuffle(pool.filter(w=>w.w.length>3));const nb=Math.floor(n/3)+(Math.random()<.5?1:0);return shuffle([...big.slice(0,nb),...sm.slice(0,n-nb)]);}
  return shuffle(pool).slice(0,n);
}
const MATCH_PAIRS={k:4,g1:6,g2:8};
function startGame(type){
  const total=type==='match'?(MATCH_PAIRS[S.level]||4):5;
  G={type,i:0,total,words:pickWords(total,type),streak:0,earned:0,miss:0,done:0,locked:false,hint:null,lv:S.level};
  show('game');
  $('#gTitle').innerHTML=`${GAMES[type].icon} ${GAMES[type].name} <span class="lvchip" style="--l1:${LV().c1};--l2:${LV().c2}">${LV().icon} ${LV().short}${MULT()>1?' · '+MULT()+'x 🪙':''}</span>`;

/* --- Missing Letter --- */
function findChunks(word,lv){
  const groups=CHUNK_GROUPS[lv];if(!groups)return [];
  const out=[];
  for(const g of groups)for(const ch of g){
    let i=word.indexOf(ch);
    while(i>=0){
      const okEnd=!['ing','ed'].includes(ch)||i+ch.length===word.length;
      if(okEnd&&!(ch==='er'&&g.includes('ing')&&i+2!==word.length))out.push({i,ch,g});
      i=word.indexOf(ch,i+1);
    }
  }
  return out;
}
function renderMissing(w){
  const word=w.w,lv=S.level;
  let idx,len=1,ans,opts;
  const chunks=findChunks(word,lv);
  const nOpts=lv==='g2'?4:3;
  if(chunks.length&&Math.random()<(lv==='g2'?.85:.65)){
    const c=pick(chunks);idx=c.i;len=c.ch.length;ans=c.ch;
    let pool=c.g.filter(x=>x!==ans&&word.slice(0,idx)+x+word.slice(idx+len)!==word);
    if(pool.length<nOpts-1)pool=pool.concat(shuffle(CHUNK_GROUPS[lv].flat().filter(x=>x!==ans&&!pool.includes(x))));
    opts=shuffle([ans,...shuffle([...new Set(pool)]).slice(0,nOpts-1)]);
  }else{
    const vi=[...word].map((c,i)=>VOWELS.includes(c)?i:-1).filter(i=>i>=0);
    idx=(Math.random()<.5&&vi.length)?pick(vi):rand(word.length);
    ans=word[idx];
    opts=shuffle([ans,...randLetters(nOpts-1,ans,VOWELS.includes(ans)?VOWELS+(lv==='k'?'':'y'):ALPHA.replace(/[aeiou]/g,''))]);
  }
  G.ans=ans;
  const ccols=['#ff5fa2','#9b5de5','#00bbf9','#ff9f1c'];
  const parts=[];for(let i=0;i<word.length;){if(i===idx){parts.push(`<span class="blank ${len>1?'multi':''}" id="blank">${len>1?'?'.repeat(1):'?'}</span>`);i+=len;}else{parts.push(`<span>${word[i]}</span>`);i++;}}
  $('#gArea').innerHTML=qHeader(w)+
    `<div class="mword ${word.length>=6?'long':''}" style="--n:${parts.length}">${parts.join('')}</div>
     ${len>1?`<div class="note" style="font-size:22px">Which letters go together? 🧩</div>`:''}
     <div class="choices">${opts.map((l,i)=>`<button class="btn choice ${l.length>1?'multi':''}" style="--cc:${ccols[i%4]}" data-l="${l}">${l}</button>`).join('')}</div>
     <button class="btn hintbtn" id="hintBtn" aria-label="Hint">💡</button>`;
  wireSay(w);
  G.hint=()=>{const b=$$('.choice').find(b=>b.dataset.l===ans);if(b)b.classList.add('hint');};
  $('#hintBtn').onclick=()=>{G.miss=Math.max(G.miss,1);G.hint();};
  $$('.choice').forEach(b=>b.onclick=()=>{
    if(G.locked||b.disabled)return;
    if(b.dataset.l===ans){const bl=$('#blank');bl.textContent=ans;bl.classList.add('filled');SFX.pop();if(ans.length>1)say(ans.split('').join(' '),1);gotIt(w,bl);}
    else{oops(b);b.disabled=true;}
  });
}

  wireSay(w);

  const b={list:[],pos:0,last:0,t0:performance.now(),raf:0,stop:false,hint:false,word};B=b;
  G.hint=()=>{b.hint=true;b.list.forEach(x=>x.el.classList.toggle('hint',x.l===word[b.pos]));};
  const BAL={k:{speed:word.length<=3?70:85,gap:word.length<=3?1100:950,start:3,need:.3},g1:{speed:100,gap:850,start:4,need:.25},g2:{speed:115,gap:720,start:5,need:.2}}[S.level]||{speed:80,gap:1000,start:3,need:.3};
  const speed=BAL.speed*Math.min(1,Math.max(.75,sky.clientHeight/480));

    const present=b.list.some(x=>x.l===need&&x.y<h*.6);

    el.style.setProperty('--bc',pick(['#ff5f7e','#ff9f1c','#9b5de5','#00bbf9','#06d6a0','#ff5fa2','#f7b801']));

      b.pos++;b.hint=G.miss>=2;

      else{sayLetter(o.l);$(`.slot[data-i="${b.pos}"]`).classList.add('next');if(b.hint)G.hint();}
    }else oops(o.el);
  }

  let prev=performance.now();
  function loop(t){
    if(b.stop)return;
    const dt=Math.min(.05,(t-prev)/1000);prev=t;

/* --- Squishy Squeeze --- */
function renderSquishy(w){
  const easy=S.level==='k';
  const ans=easy?w.w[0]:w.w;
  let opts;
  if(easy)opts=shuffle([ans,...randLetters(2,ans)]);
  else{ // look-alike decoys: same first letter, same ending or similar length
    const n=S.level==='g2'?3:2,others=LV().words.filter(x=>x.w!==w.w);
    const score=x=>(x.w[0]===w.w[0]?2:0)+(x.w.slice(-2)===w.w.slice(-2)?2:0)+(Math.abs(x.w.length-w.w.length)<=1?1:0)+Math.random()*1.5;
    opts=shuffle([w.w,...others.sort((a,b)=>score(b)-score(a)).slice(0,n).map(x=>x.w)]);
  }
  G.ans=ans;
  const cols=['#ff9ed2','#8fe3ff','#b8f28a','#ffd36b','#c9a6ff'];
  const ears=['🐰','🐻','🐱','',''];
  $('#gArea').innerHTML=qHeader(w)+
    (easy?`<div class="mword"><span class="blank" id="blank">?</span>${[...w.w.slice(1)].map(c=>`<span>${c}</span>`).join('')}</div><div class="note" style="font-size:24px">Squeeze the first letter! 🤏</div>`
         :`<div class="note" style="font-size:26px;margin-top:10px">Squeeze the word you hear! 🤏</div>`)+
    `<div class="squishes">${opts.map((o,i)=>`<button class="squish" style="--sc:${cols[(i+rand(2))%cols.length]}" data-v="${o}"><span class="face">• ᴗ •</span><span class="lbl ${easy?'':'w'} ${o.length>=7?'xl':''}">${o}</span></button>`).join('')}</div>
     <button class="btn hintbtn" id="hintBtn" aria-label="Hint">💡</button>`;
  wireSay(w);
  G.hint=()=>{const b=$$('.squish').find(b=>b.dataset.v===ans);if(b)b.classList.add('hint');};
  $('#hintBtn').onclick=()=>{G.miss=Math.max(G.miss,1);G.hint();};
  $$('.squish').forEach(b=>b.onclick=()=>{
    if(G.locked)return;
    b.classList.remove('sq');void b.offsetWidth;b.classList.add('sq');SFX.squish();
    if(b.dataset.v===ans){b.querySelector('.face').textContent='^ ᴗ ^';if(easy){const bl=$('#blank');bl.textContent=ans;bl.classList.add('filled');}gotIt(w,b);}
    else{b.querySelector('.face').textContent='• ﹏ •';setTimeout(()=>{const f=b.querySelector('.face');if(f)f.textContent='• ᴗ •';},900);oops(null);}
  });
}

     <div class="rar-banner" style="--rc:${RCOL[card.r]}">${card.r==='L'?'🌈✨ LEGENDARY! ✨🌈':RAR[card.r].name+'!'}</div>
     <div class="reveal-card">${cardHTML(card,false,S.cards[card.id])}</div>
     <div class="tapcount">${isNew?'🆕 NEW for your collection!':'You got another one! x'+S.cards[card.id]}</div>
     <div class="row" style="position:relative"><button class="btn pk" id="uAgain">🎁 Another!</button><button class="btn bl" id="seeCol">📚 My Cards</button><button class="btn yl" id="uHome">🏠</button></div></div>`;
  say('Wow! '+card.name.replace('67','six seven')+'! '+RAR[card.r].name+'!');
  colTab=card.cat;
  $('#uAgain').onclick=()=>renderUnbox();$('#seeCol').onclick=()=>show('collection');$('#uHome').onclick=()=>show('home');
}

/* ================= PARENT CORNER ================= */
function openParent(){
  SFX.tap();
  const draw=()=>openModal(`<div class="parent-panel"><h2>🔒 Grown-up Corner</h2>
    <p class="note">Progress is saved in this browser on this device.</p>
    <div><button class="btn go" data-p="c50">+50 🪙</button><button class="btn go" data-p="c500">+500 🪙</button><button class="btn pk" data-p="ball">+1 🎁</button></div>
    <div><b style="font-size:20px">Grade level:</b>${levelPickerHTML(true)}
      <p class="note">K: 3–4 letter words (1x coins) · 1st: blends, digraphs, silent e, sight words (2x) · 2nd: vowel teams, r-controlled, 2-syllable, -ing/-ed (3x). Higher grades also get better Surprise Ball odds.</p></div>
    <div><b style="font-size:20px">Voice:</b> <button class="btn ${S.rate<=0.7?'yl':''}" data-p="slow">🐢 Slow</button><button class="btn ${S.rate>0.7&&S.rate<0.95?'yl':''}" data-p="med">🙂 Normal</button><button class="btn ${S.rate>=0.95?'yl':''}" data-p="fast">🐇 Faster</button>
    ${hasSpeech?'':'<p class="note">⚠️ This browser has no text-to-speech, so words won\'t be read aloud.</p>'}</div>
    <p class="note">Words learned: ${S.words} · Rounds: ${S.rounds} · Cards: ${Object.keys(S.cards).length}/${CARDS.length}</p>
    <div><button class="btn" data-p="reset" style="background:#ffe0e0">🗑️ Reset all progress</button><button class="btn bl" data-p="close">✅ Done</button></div></div>`,m=>{
    wireLevelPicker(m,draw);
    m.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      const p=b.dataset.p;
      if(p==='c50')addCoins(50);if(p==='c500')addCoins(500);if(p==='ball'){S.freeBalls++;save();toast('+1 🎁');}

      if(p==='slow'){S.rate=0.65;save();say('This is slow');}if(p==='med'){S.rate=0.8;save();say('This is normal');}if(p==='fast'){S.rate=1;save();say('This is faster');}
      if(p==='close'){closeModal();show(CUR);return;}
      if(p==='reset'){openModal(`<h2>Reset everything?</h2><p>Coins, clothes, and cards will be erased.</p><div class="row"><button class="btn pk" id="rsYes">Yes, reset</button><button class="btn" id="rsNo">Cancel</button></div>`,()=>{
        $('#rsNo').onclick=draw;$('#rsYes').onclick=()=>{S=DEFAULT_STATE();S.lastDaily=todayStr();save();closeModal();show('home');toast('Fresh start! ✨');};});return;}
      draw();
    });
  });
  draw();
}

/* ================= INIT ================= */
function checkDaily(){
  const t=todayStr();
  if(S.lastDaily!==t){
    const first=!S.lastDaily;S.lastDaily=t;S.coins+=10;save();updateHeader();
    openModal(`<div class="bigemo">🌞🎁</div><h2>${first?'Welcome, Superstar!':'Daily Bonus!'}</h2><p style="font-size:40px;font-weight:700">+10 🪙</p><p>Come back tomorrow for more! 💖</p><div class="row"><button class="btn go" id="dailyOk" style="font-size:36px">🎉 Yay!</button></div>`,()=>{
      $('#dailyOk').onclick=()=>{SFX.coin();confettiRain(80);say(first?'Welcome! Let\'s play and spell!':'Daily bonus! Ten coins!');closeModal();renderHome();};});
  }
}
show('home');
checkDaily();
</script>
</body>
</html>
